name: Portable distribution

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go/kame/go.mod
          cache-dependency-path: src/go/kame/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: jdx/mise-action@v4
      - name: Install Solod compiler
        shell: bash
        run: |
          go install solod.dev/cmd/so@v0.4.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Test Linux core and native host
        run: make test-so
      - name: Build portable artifacts and Windows launcher
        run: make dist-ape dist-wasm dist-windows build/kame.debug
      - name: Check WASM ABI, CLI and signed release packaging
        run: |
          make wasm-check
          bash tests/T010-06-wasm-cli.sh
          bash tests/T015-07-dist-cosmocc-integrity.sh
          bash tests/T015-04-dist-signed-release.sh
      - name: Check WASM memory reuse and self-bootstrap
        run: |
          node tools/wasm/test-memory-reuse.mjs
          node tools/wasm/test-self-build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: kame-portable
          path: |
            dist/kame.com
            dist/ape-smoke.com
            dist/kame.js
            dist/kame.wasm
            dist/windows/
            dist/kame-windows-x64.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: kame-portable
          path: dist
      - run: bash src/sh/test-ape.sh dist/kame.com dist/ape-smoke.com

  darwin:
    runs-on: macos-15-intel
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: kame-portable
          path: dist
      - run: bash src/sh/test-ape.sh dist/kame.com dist/ape-smoke.com

  freebsd:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: kame-portable
          path: dist
      - uses: vmactions/freebsd-vm@v1
        with:
          release: '15.1'
          prepare: pkg install -y bash
          run: bash src/sh/test-ape.sh dist/kame.com dist/ape-smoke.com

  netbsd:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: kame-portable
          path: dist
      - uses: vmactions/netbsd-vm@v1
        with:
          usesh: true
          prepare: /usr/sbin/pkg_add bash
          run: bash src/sh/test-ape.sh dist/kame.com dist/ape-smoke.com

  windows:
    runs-on: windows-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: kame-portable
          path: dist
      - name: Test WASM launcher and CLI on Windows
        run: node tools/windows/test-launcher.mjs dist/windows
      - name: Test APE CLI on Windows without Node
        shell: pwsh
        timeout-minutes: 5
        run: ./tools/windows/test-native-cli.ps1 dist/kame-windows-x64.exe
