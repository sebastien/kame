name: Windows launcher runtime

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go/kame/go.mod
      - uses: jdx/mise-action@v4
      - name: Install Solod compiler
        shell: bash
        run: |
          go install solod.dev/cmd/so@v0.4.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build Windows launcher bundle
        run: make dist-windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-kame-bundle
          path: dist/windows
          if-no-files-found: error

  windows-runtime:
    runs-on: windows-latest
    needs: build-bundle
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: windows-kame-bundle
          path: dist/windows
      - name: Test packaged launcher and CLI on Windows
        run: node tools/windows/test-launcher.mjs dist/windows
