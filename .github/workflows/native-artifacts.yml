name: Native CLI artifacts (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go/kame/go.mod
          cache-dependency-path: src/go/kame/go.sum
      - name: Run native package and host tests
        run: make test-unit
      - name: Build host-native CLI
        run: make dist-native
      - name: Run host-native CLI
        shell: bash
        run: 'for kame in ./dist/native/*/kame; do "$kame" --version; done'
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ runner.os }}-${{ runner.arch }}
          path: dist/native/
          if-no-files-found: error
